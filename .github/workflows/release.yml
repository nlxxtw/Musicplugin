name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.7). Leave empty to use manifest version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG version=$VERSION"

      - name: Pack plugin zip
        shell: bash
        run: |
          mkdir -p dist/qqovo-music
          # ship runtime files only
          for f in manifest.json index.js style.css icon.svg README.md echo-plugins.json; do
            if [ -f "$f" ]; then cp "$f" "dist/qqovo-music/"; fi
          done
          # optional source helpers (not required at runtime)
          if [ -f build.mjs ]; then cp build.mjs dist/qqovo-music/; fi
          if [ -f _qishui_src.ts ]; then cp _qishui_src.ts dist/qqovo-music/; fi
          cd dist
          zip -r "qqovo-music-${{ steps.meta.outputs.version }}.zip" qqovo-music
          ls -lah

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: qqovo-music ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/qqovo-music-${{ steps.meta.outputs.version }}.zip
          body: |
            ## qqovo-music ${{ steps.meta.outputs.version }}

            EchoMusic 安装：插件管理 → 添加插件源 `github:nlxxtw/Musicplugin` → 安装/更新。

            国内下载可走加速（整仓 zip 示例）：
            `https://github.19492035.xyz/https://github.com/nlxxtw/Musicplugin/archive/refs/heads/main.zip`

            Release 资源也可经同前缀加速：
            `https://github.19492035.xyz/https://github.com/nlxxtw/Musicplugin/releases/download/${{ steps.meta.outputs.tag }}/qqovo-music-${{ steps.meta.outputs.version }}.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
